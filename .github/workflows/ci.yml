name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check branch name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix|docs|chore)/[0-9]+-[a-z0-9-]+$ ]] && [[ ! "$BRANCH" =~ ^dependabot/ ]]; then
            echo "Branch '$BRANCH' must match <type>/<issue>-<short-description>, e.g. feature/12-snooze-button"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check dependency versions match the Expo SDK (warning only)
        continue-on-error: true
        run: |
          if ! npx expo install --check > expo-check.txt 2>&1; then
            cat expo-check.txt
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=Expo SDK version drift::$line"
            done < expo-check.txt
            echo "Fix locally with: npx expo install --fix"
            exit 1
          fi

      - name: Lint and tests
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Build check (web export)
        run: npx expo export --platform web --output-dir dist

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
