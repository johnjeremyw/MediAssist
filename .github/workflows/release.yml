name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Web build
        run: |
          npx expo export --platform web --output-dir dist
          zip -qr mediassist-web-${{ github.ref_name }}.zip dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            sbom.cdx.json
            mediassist-web-${{ github.ref_name }}.zip

      # Android build on Expo's servers. Runs only once an EXPO_TOKEN secret is added.
      - name: Android build (EAS)
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npx eas-cli build --platform android --profile production --non-interactive --no-wait
